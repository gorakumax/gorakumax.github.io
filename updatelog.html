<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>更新情報一覧</title>
	<link rel="preload" href="/common/style.css" as="style">
    <link rel="stylesheet" href="/common/style.css">
    <script src="/common/common.js" defer></script>

		<style>
.loader {
  font-size: 14px;
  color: #666;
  animation: pulse 1.5s infinite ease-in-out;
  display: inline-block;
}

@keyframes pulse {
  0% { opacity: 0.4; }
  50% { opacity: 1; }
  100% { opacity: 0.4; }
}
		</style>
		<script>
		// 先ほどコピーしたウェブアプリのURL
const GAS_URL = "https://script.google.com/macros/s/AKfycbxlNuwqMJ3IAPcWSHiW2ZemvsSTxx0lGx6Ypc3ZUR1_0P0MpvwgzJ1X8aU4f8tuXuW-PQ/exec";

async function loadUpdates() {
  const container = document.getElementById('update-info');
  
  try {
    const response = await fetch(`${GAS_URL}?limit=30`);
    const data = await response.json();

    if (data.length === 0) {
      container.innerHTML = "<p>更新情報はありません。</p>";
      return;
    }

    let htmlContent = "<ul>";
    data.forEach(item => {
      // 【ここが重要】改行コード（\n）を HTMLの改行タグ（<br>）に置き換える
      const formattedContent = item.content.replace(/\n/g, '<br>');
      
      // デザインに合わせて組み立て（日付の後に改行を入れて内容を表示）

htmlContent += `<li>${formattedContent} … ${item.date}</li><hr>`;
    });
    htmlContent += "</ul>";

    container.innerHTML = htmlContent;

  } catch (error) {
    console.error("読み込みエラー:", error);
    container.innerHTML = "<p>情報の取得に失敗しました。</p>";
  }
}

window.onload = loadUpdates;
</script>
	</head>
	<body>
	<!--サイドメニュータグ-->
   <div id="menu-trigger" onclick="toggleNav()">
    <span></span>
    <span class="menu-text">Menu</span>
    <span></span>
</div>
<nav id="side-nav">
    <div data-include="menubar.html"></div>
</nav>
<div id="nav-overlay" onclick="toggleNav()"></div>
<!--ここまで-->
	<h1>更新情報ログ</h1>
<div id="update-info">
  <span class="loader">情報を取得中...</span>
</div>
	</body>
</html>
